<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============ SEO basics (edit these to match your details) ============ -->
    <title>Hans Christopher Valentino — Aspiring Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Hans Christopher Valentino, an aspiring full-stack developer who builds fast, accessible and delightful web experiences with React, Node.js and modern tooling."
    />
    <meta name="keywords" content="Hans Christopher Valentino, portfolio, full-stack developer, React developer, web developer, JavaScript" />
    <meta name="author" content="Hans Christopher Valentino" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain.com/" />
    <meta name="theme-color" content="#ebe5d5" />

    <!-- Open Graph (Facebook, LinkedIn, Discord …) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="Hans Christopher Valentino — Aspiring Full-Stack Developer" />
    <meta
      property="og:description"
      content="I build fast, accessible and delightful web experiences. Explore my projects, skills and experience."
    />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Hans Christopher Valentino" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hans Christopher Valentino — Aspiring Full-Stack Developer" />
    <meta name="twitter:description" content="I build fast, accessible and delightful web experiences." />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Space Grotesk (display), IBM Plex Sans (body), IBM Plex Mono (code), VT323 (90s pixel chrome) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=VT323&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data so search engines understand who this site is about -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Your Name",
        "jobTitle": "Aspiring Full-Stack Developer",
        "url": "https://your-domain.com/",
        "sameAs": ["https://github.com/your-username", "https://www.linkedin.com/in/your-username"]
      }
    </script>

    <!--
      Apply the saved theme BEFORE first paint to avoid a flash.
      Defaults to classic 90s light desktop ('light') unless 'dark' was saved.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved ? saved === 'dark' : false
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
