[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so /certificates loads index.html directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
